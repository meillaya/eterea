name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-workspace:
    name: Rust workspace verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Cache Cargo registry, git, and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Rust formatting
        run: devenv shell -- cargo fmt --all -- --check

      - name: Rust clippy
        run: devenv shell -- cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: devenv shell -- cargo test --workspace

      - name: Dioxus release build
        run: devenv shell -- cargo build -p eterea-dioxus --release

      - name: Performance baseline
        run: devenv shell -- scripts/perf-baseline.sh
