[workspace]
resolver = "2"
members = [
    "src/backend",
    "src/app",
    "src/logic",
    "src/ui-model",
    "src/media",
    "src/desktop"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Ship one optimized binary: fat LTO and a single codegen unit trade build
# time for runtime speed, panic abort removes unwind tables, and strip removes
# symbols that a desktop app never reads at runtime.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
incremental = false
debug = false
overflow-checks = false

# Rune is pre-release and pins its own patched crates. Cargo does not inherit
# patches from a dependency, so the workspace carries the same set at the same
# revision. See https://github.com/anomalyco/rune, "Depending on Rune".
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
