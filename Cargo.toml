[workspace]
resolver = "2"
members = [
    "src/backend",
    "src/app",
    "src/dioxus-app"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Ship one optimized binary: fat LTO and a single codegen unit trade build
# time for runtime speed, panic abort removes unwind tables, and strip removes
# symbols that a desktop app never reads at runtime.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
incremental = false
debug = false
overflow-checks = false
